interface:
  display_name: "Hoursly from Computer History"
  short_description: "Review human and agent entries, outcomes and conflicts"
  default_prompt: "Use $capture-computer-history to deliver today's human and agent entry table with start/end times, durations, achieved outcomes, tokens, Hoursly assignments and evidence conflicts for my review; do not save entries."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "hoursly"
      description: "Hoursly MCP server"
      transport: "streamable_http"
      url: "https://mcp.hoursly.app/mcp"
