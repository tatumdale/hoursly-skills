interface:
  display_name: "Hoursly from Computer History"
  short_description: "Review work, meetings and agent usage with rounding choices"
  default_prompt: "Use $capture-computer-history to review today across Computer History, calendars, email, attachments and agent sessions, with Hoursly assignments, verified tokens and rounding choices; do not save any entries."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "hoursly"
      description: "Hoursly MCP server"
      transport: "streamable_http"
      url: "https://mcp.hoursly.app/mcp"
