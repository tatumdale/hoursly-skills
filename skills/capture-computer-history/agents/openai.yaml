interface:
  display_name: "Hoursly from Computer History"
  short_description: "Combine computer work, meetings and travel into a time review"
  default_prompt: "Use $capture-computer-history to review yesterday using Computer History, connected calendars, email and relevant attachments. Propose Hoursly entries without saving any."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "hoursly"
      description: "Hoursly MCP server"
      transport: "streamable_http"
      url: "https://mcp.hoursly.app/mcp"
