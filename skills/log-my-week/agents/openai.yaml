interface:
  display_name: "Log my week"
  short_description: "Review human and agent work"
  default_prompt: "Use $log-my-week to reconstruct my week, explain what I achieved and propose human and agent entries for review. Use Computer History where available and other connected work records for the gaps. Do not save anything."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "hoursly"
      description: "Hoursly MCP server"
      transport: "streamable_http"
      url: "https://mcp.hoursly.app/mcp"
