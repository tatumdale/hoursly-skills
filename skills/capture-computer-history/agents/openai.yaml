interface:
  display_name: "Hoursly work review"
  short_description: "Turn your work history into a readable timesheet review"
  default_prompt: "Use $capture-computer-history to reconstruct my day, explain what I achieved and propose human and agent entries for review. Use Computer History where available and other connected work records for the gaps. Do not save anything."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "hoursly"
      description: "Hoursly MCP server"
      transport: "streamable_http"
      url: "https://mcp.hoursly.app/mcp"
