interface:
  display_name: "Hoursly core"
  short_description: "Use Hoursly records and controls safely"
  default_prompt: "Use $hoursly-core to orient on my Hoursly workspace and handle this request safely."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
