interface:
  display_name: "Workspace setup"
  short_description: "Review and configure workspace settings"
  default_prompt: "Use $workspace-setup to review this in Hoursly and show the evidence and next steps."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "hoursly"
      description: "Hoursly MCP server"
      transport: "streamable_http"
      url: "https://mcp.hoursly.app/mcp"
